[Aggregate]
DAILY_TIME                      = 06:00
PLOT_HandHardness               = TRUE
PLOT_TSplain                    = TRUE
PLOT_TSstability                = TRUE
PLOT_Leadtime_days_HandHardness = 3
SAVEAS_rds                      = TRUE
DEBUG_MODE                      = TRUE
PROGRESSBAR                     = TRUE

[Forecast]
DATE_OPERA = NA
SEASON_END = NA

[General]
NTASKS = 1

[Advanced]
WEIGHTS_GTYPE                   = 0.375
WEIGHTS_HARDNESS                = 0.125
WEIGHTS_DDATE                   = 0.5
SIM_TYPE                        = RTA_SCALING

[Paths]
_aggregates_vstations_csv_file = _vstations_csv_file
_aggregates_snp_pro_dir = _snp_ouput_dir


[CONFIG-INFO]
# DAILY_TIME is in time zone of profiles (as obtained by SMET file header)
# SAVEAS_rds: save average profiles as rds files (R objects)? 
#     TRUE: save average profiles and resampled individual profiles for further analysis
#     MINIMAL: save only average profiles without inidividual profiles. Saves disk space, but complicates detailed analysis posthoc.
# DTW WEIGHTS need to be adjusted if, for example, DDATE were not available from .pro files!
# SIM_TYPE: read up on the details here: https://rdrr.io/cran/sarp.snowprofile.alignment/man/simSP.html
# _aggregates_vstations_csv_file: path/to/csv_file, defaults to ini variable set in the AWSOME forecast toolchain.
# _aggregates_snp_pro_dir: path/to/pro_file/directory, defaults to ino variable set in the AWSOME forecast toolchain.