[AVAPRO]
# SIM_FOLDER_PATH = ./output/2023-01-19T11h45-Ottenspitze-2021m-N/
SIM_FOLDER_PATH = ./output/AXLIZ_PROF/
# initilization_type = station
initilization_type  = profile
drytime             = 6
wettime             = 15
debug               = 1
# Only for type station
season_start        = 2021-10-23
season_end          = 2022-05-28

# Option: 'snp' or 'cro', 'cro' not implemented
scmopt              = snp

[AVAPRO-THOLDS-WL]
calcFEM=0          
owSCtaup=0                 
lookat= 0                    
aggrgtDAPs= 1 
aggrgtdiff=0.03 
outputDAP=0      
dropini=5
droppro=.64            
drftthrsh=.4           
minSLdens=120         
minnsthrsh=.05       
nsthrsh=.2            
minSLthrsh=.2         
lwcthrsh_0 =0.01 
lwcthrsh_1 =0.03          
dysisomax=3

[AVAPRO-THOLDS-APS-SNP] 
damthrshnap=99      
inithrshnap=999    
propthrshnap= 99     
damthrshpap=18      
inithrshpap= 1.31       
propthrshpap=.42    
drftthrsh=3         


[AVAPRO-THOLDS-APS-CRO]
damthrshnap=27     
propthrshnap=.55    
damthrshpap=27
propthrshpap=.56   
drftthrsh=265

[INFO]
#avaProbs_thresholds_aps 
; alp=38
; calcFEM=0           #%=1; means use FEM model to calcuate shear stress at WL, slab modulus, slab tensile stresses
; owSCtaup=0                  #%=1; means overwrite snow cover shear strength (tau_p)
; lookat= 0                       #%say if you want to see a graph
; aggrgtDAPs= 1 
; aggrgtdiff=0.03 #%aggregate DAPs if they are located within aggrgtdiff [m]
; outputDAP=0                   #% index of DAP to output; can create table: table(DAPLAYEROUT_txt,DAPLAYEROUT_dou)
; #%% basic decision data   ## matlab line 84
; dropini=5
; droppro=.64            #thresholds of initiation and propgation criteria for dropping (deep-)persitent weak layers
; drftthrsh=.4           #min height of snow drifts [m], snp=:0.4m, cro:.2
; minSLdens=120         #120,min average density of a potential slab
; minnsthrsh=.05        #def.: 0.05m,min. amount of new snow [m], to start identifying problems (we find WL with windows, do don't care about +-5cm of fresh snow)
; nsthrsh=.2            #def.: .2,amount of new snow [m] (within 48 or 24 hr), to keep a non-persis. problem for one more day
; minSLthrsh=.2         #def.: .2,min. slab thickness [m] to be considered a healthy slab, 
; lwcthrsh_0,1 =0.01    # Christophs LWC threshold for maztrix flow: 0.03; threshold for preferential flow: 0.01
; dysisomax=3           # How long is snowpack isotherm until it reaches stability again?
; minfracswetsnow=0.7   # Min fraction of snow height for wap, def.: 0.7 * max snow height during season

